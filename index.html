<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="background" aria-hidden="true">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="blob blob-c"></div>
      <div class="blob blob-d"></div>
    </div>

    <main>
      <div id="clock" class="clock">--:--</div>
      <p id="greeting" class="greeting">&nbsp;</p>

      <!-- data-mode lets each button carry its own value, so one click
           handler can serve all three instead of writing three of them. -->
      <div class="modes" role="tablist" aria-label="Timer mode">
        <button class="mode-btn is-active" data-mode="focus">Focus</button>
        <button class="mode-btn" data-mode="short">Short Break</button>
        <button class="mode-btn" data-mode="long">Long Break</button>
      </div>

      <div id="timer" class="timer">25:00</div>

      <div class="controls">
        <button id="start-btn" class="btn btn-primary">Start</button>
        <button id="reset-btn" class="btn btn-ghost">Reset</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
